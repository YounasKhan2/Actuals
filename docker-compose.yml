services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: actuals
      POSTGRES_USER: actuals
      POSTGRES_PASSWORD: actuals
    ports:
      - "5432:5432"
    volumes:
      - actuals_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actuals -d actuals"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  actuals_postgres:
